# Order Process API - local environment (env=local).
# Non-secret settings. Passwords here are the docker-compose local-dev ones;
# in CloudHub they are replaced by encrypted secure properties.

http:
  host: "0.0.0.0"
  port: "8082"

app:
  name: "order-process-api"
  env: "local"

customerSysApi:
  baseUrl: "http://localhost:8091/api/v1"

inventorySysApi:
  baseUrl: "http://localhost:8092/api/v1"

orderSysApi:
  baseUrl: "http://localhost:8093/api/v1"

paymentSysApi:
  baseUrl: "http://localhost:8094/api/v1"

shippingSysApi:
  baseUrl: "http://localhost:8095/api/v1"

amqp:
  host: "localhost"
  port: "5672"
  virtualHost: "fulfillment"
  username: "mule"
  password: "mule_local"
  exchange: "fulfillment.events"

notifications:
  slackEnabled: "false"
