# Shipping System API - local environment (env=local).
# Non-secret settings. Passwords here are the docker-compose local-dev ones;
# in CloudHub they are replaced by encrypted secure properties.

http:
  host: "0.0.0.0"
  port: "8095"

app:
  name: "shipping-sys-api"
  env: "local"

carrier:
  baseUrl: "http://localhost:8089/v1"
  apiKey: "fastship-local-key"
  responseTimeoutMs: "5000"
  maxRetries: "3"
  retryIntervalMs: "1000"
