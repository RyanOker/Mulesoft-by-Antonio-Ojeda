# Orders Experience API - local environment (env=local).
# Non-secret settings. Passwords here are the docker-compose local-dev ones;
# in CloudHub they are replaced by encrypted secure properties.

http:
  host: "0.0.0.0"
  port: "8081"

app:
  name: "orders-exp-api"
  env: "local"

orderProcessApi:
  baseUrl: "http://localhost:8082/api/v1"

inventorySysApi:
  baseUrl: "http://localhost:8092/api/v1"

shippingSysApi:
  baseUrl: "http://localhost:8095/api/v1"

cache:
  productTtlSeconds: "60"
