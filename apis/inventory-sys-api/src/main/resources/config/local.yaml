# Inventory System API - local environment (env=local).
# Non-secret settings. Passwords here are the docker-compose local-dev ones;
# in CloudHub they are replaced by encrypted secure properties.

http:
  host: "0.0.0.0"
  port: "8092"

app:
  name: "inventory-sys-api"
  env: "local"

db:
  host: "localhost"
  port: "5432"
  database: "fulfillment"
  user: "inventory_api"
  password: "inventory_api_local"

reservations:
  expiryMinutes: "30"
  expiryJobFrequencyMinutes: "5"
